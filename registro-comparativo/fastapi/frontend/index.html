<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="registro-api" content="http://127.0.0.1:8000">
  <title>Registro de usuarios · FastAPI</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="framework">FastAPI</p>
      <h1>Registro de usuarios</h1>
      <p>Completa los datos y adjunta una imagen para crear el registro.</p>
    </header>
    <form novalidate>
      <label for="dni">DNI</label>
      <input id="dni" name="dni" inputmode="numeric" maxlength="8" pattern="[0-9]{8}" placeholder="00000000" aria-describedby="dni-ayuda" required>
      <small id="dni-ayuda">Escribe exactamente ocho dígitos.</small>
      <div class="names">
        <div><label for="nombres">Nombres</label><input id="nombres" name="nombres" autocomplete="given-name" required></div>
        <div><label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" autocomplete="family-name" required></div>
      </div>
      <label for="imagen">Imagen</label>
      <input id="imagen" name="imagen" type="file" accept="image/png,image/jpeg" aria-describedby="imagen-ayuda" required>
      <small id="imagen-ayuda">PNG o JPEG de menos de 1 000 000 bytes.</small>
      <button type="submit">Crear registro</button>
    </form>
    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
